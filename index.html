<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliação Online</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f3f5;
    color:#222;
}

body{
    overflow-x:hidden;
}

button,input{
    font:inherit;
}

.tela{
    min-height:100vh;
    width:100%;
}

/* =========================
   TELA INICIAL
   ========================= */
#inicio{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:linear-gradient(135deg,#111,#292929);
}

.caixa-inicio{
    width:min(560px,100%);
    background:#fff;
    border-radius:16px;
    padding:35px;
    box-shadow:0 15px 45px rgba(0,0,0,.30);
    text-align:center;
}

.logo{
    width:82px;
    height:82px;
    margin:0 auto 18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#31b279;
    color:#fff;
    font-size:30px;
    font-weight:bold;
}

.caixa-inicio h1{
    margin:0 0 10px;
    font-size:28px;
}

.caixa-inicio p{
    color:#555;
    line-height:1.5;
}

.nome-box{
    text-align:left;
    margin-top:25px;
}

.nome-box label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

#nomeAluno{
    width:100%;
    padding:14px;
    border:1px solid #bbb;
    border-radius:8px;
    outline:none;
}

#nomeAluno:focus{
    border-color:#31b279;
    box-shadow:0 0 0 3px rgba(49,178,121,.15);
}

.btn{
    border:0;
    border-radius:8px;
    padding:14px 22px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-principal{
    width:100%;
    margin-top:20px;
    background:#31b279;
    color:#fff;
}

.btn-principal:disabled{
    background:#aaa;
    cursor:not-allowed;
    transform:none;
}

.aviso{
    margin-top:18px;
    padding:12px;
    border-radius:8px;
    background:#fff7df;
    color:#6b5200;
    font-size:13px;
    text-align:left;
}

/* =========================
   PROVA
   ========================= */
#prova{
    display:none;
    background:#eef0f2;
}

.topo{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    min-height:72px;
    background:#111;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:12px 22px;
    box-shadow:0 3px 12px rgba(0,0,0,.25);
}

.topo-info{
    min-width:0;
}

.topo-titulo{
    font-size:18px;
    font-weight:bold;
}

#alunoExibicao{
    margin-top:4px;
    font-size:13px;
    color:#ddd;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.timer{
    min-width:130px;
    text-align:center;
    background:#31b279;
    border-radius:8px;
    padding:10px 14px;
    font-weight:bold;
    font-size:18px;
}

.timer.critico{
    background:#c62828;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{opacity:.65}
}

.form-container{
    width:min(1100px,96%);
    margin:0 auto;
    padding-top:95px;
    padding-bottom:35px;
}

.form-card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

#googleForm{
    display:block;
    width:100%;
    height:calc(100vh - 115px);
    min-height:850px;
    border:0;
    background:#fff;

    /* O Google Forms precisa permanecer totalmente interativo. */
    pointer-events:auto;
    user-select:auto;
    -webkit-user-select:auto;
    touch-action:auto;
}

/* =========================
   FINAL
   ========================= */
#finalizado{
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:linear-gradient(135deg,#111,#292929);
}

.caixa-final{
    width:min(600px,100%);
    background:#fff;
    border-radius:16px;
    padding:40px;
    text-align:center;
    box-shadow:0 15px 45px rgba(0,0,0,.3);
}

.icone-ok{
    width:80px;
    height:80px;
    margin:0 auto 20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#31b279;
    color:#fff;
    font-size:42px;
    font-weight:bold;
}

.caixa-final h1{
    margin:0 0 12px;
}

.caixa-final p{
    line-height:1.6;
    color:#555;
}

.motivo{
    margin-top:20px;
    padding:12px;
    background:#f3f3f3;
    border-radius:8px;
    font-size:13px;
    color:#555;
}

/* =========================
   RESPONSIVO
   ========================= */
@media(max-width:700px){
    .topo{
        padding:10px 12px;
    }

    .topo-titulo{
        font-size:15px;
    }

    #alunoExibicao{
        font-size:11px;
    }

    .timer{
        min-width:105px;
        font-size:15px;
        padding:8px;
    }

    .form-container{
        width:100%;
        padding-top:82px;
        padding-bottom:0;
    }

    .form-card{
        border-radius:0;
    }

    #googleForm{
        min-height:calc(100vh - 90px);
        height:calc(100vh - 90px);
    }

    .caixa-inicio,
    .caixa-final{
        padding:25px;
    }
}
</style>
</head>

<body>

<!-- ==========================================================
     TELA INICIAL
     ========================================================== -->
<section id="inicio" class="tela">
    <div class="caixa-inicio">

        <div class="logo">A</div>

        <h1>Avaliação Online</h1>

        <p>
            Informe seu nome para iniciar a avaliação.
        </p>

        <div class="nome-box">
            <label for="nomeAluno">Nome completo</label>
            <input
                type="text"
                id="nomeAluno"
                autocomplete="off"
                maxlength="120"
                placeholder="Digite seu nome completo">
        </div>

        <button
            id="btnIniciar"
            class="btn btn-principal"
            type="button">
            INICIAR AVALIAÇÃO
        </button>

        <div class="aviso">
            <strong>Importante:</strong>
            a avaliação possui tempo limitado e deve ser realizada
            exclusivamente nesta tela.
            Não saia da tela de avaliação.
        </div>

    </div>
</section>


<!-- ==========================================================
     TELA DA PROVA
     ========================================================== -->
<section id="prova" class="tela">

    <header class="topo">
        <div class="topo-info">
            <div class="topo-titulo">Avaliação</div>
            <div id="alunoExibicao"></div>
        </div>

        <div id="cronometro" class="timer">90:00</div>
    </header>

    <main class="form-container">
        <div class="form-card">

            <!--
                IMPORTANTE:
                O iframe permanece totalmente interativo.
                Não coloque div/overlay por cima dele.
            -->
            <iframe
                id="googleForm"
                src="https://docs.google.com/forms/d/e/1FAIpQLSdSBg1ISfOMXN7dlGn04kiQWpHRgFPJyFvHAUmsarDUWr6nyA/viewform?usp=header"
                title="Avaliação Google Forms"
                allowfullscreen
                loading="eager"
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

        </div>
    </main>

</section>


<!-- ==========================================================
     TELA FINAL
     ========================================================== -->
<section id="finalizado" class="tela">

    <div class="caixa-final">

        <div class="icone-ok">✓</div>

        <h1>Avaliação encerrada</h1>

        <p>
            A avaliação foi encerrada e esta página está bloqueada.
        </p>

        <div id="motivoFinal" class="motivo"></div>

    </div>

</section>


<script>
"use strict";

/* ==========================================================
   CONFIGURAÇÕES
   ========================================================== */

const DURACAO_PROVA = 90 * 60; // 90 minutos

const CHAVE_ENCERRADA = "avaliacao_encerrada_v2";
const CHAVE_NOME = "avaliacao_nome_v2";

let tempoRestante = DURACAO_PROVA;
let intervalo = null;

let provaIniciada = false;
let encerrando = false;

/*
 * Só consideramos a saída do fullscreen uma violação depois
 * que o fullscreen realmente foi confirmado.
 */
let fullscreenConfirmado = false;
let monitoramentoAtivo = false;


/* ==========================================================
   ELEMENTOS
   ========================================================== */

const inicio = document.getElementById("inicio");
const prova = document.getElementById("prova");
const finalizado = document.getElementById("finalizado");

const nomeAluno = document.getElementById("nomeAluno");
const alunoExibicao = document.getElementById("alunoExibicao");

const btnIniciar = document.getElementById("btnIniciar");
const cronometro = document.getElementById("cronometro");

const googleForm = document.getElementById("googleForm");
const motivoFinal = document.getElementById("motivoFinal");


/* ==========================================================
   INICIALIZAÇÃO
   ========================================================== */

document.addEventListener("DOMContentLoaded", () => {

    /*
     * Se a avaliação já foi encerrada neste navegador,
     * não permite iniciar novamente.
     */
    if (localStorage.getItem(CHAVE_ENCERRADA) === "true") {
        mostrarFinal("A avaliação já foi encerrada neste navegador.");
        return;
    }

    const nomeSalvo = localStorage.getItem(CHAVE_NOME);

    if (nomeSalvo) {
        nomeAluno.value = nomeSalvo;
    }

    atualizarBotao();

});


/* ==========================================================
   NOME
   ========================================================== */

nomeAluno.addEventListener("input", atualizarBotao);

function atualizarBotao() {

    const nome = nomeAluno.value.trim();

    btnIniciar.disabled = nome.length < 3;
}


/* ==========================================================
   INICIAR
   ========================================================== */

btnIniciar.addEventListener("click", iniciarProva);

async function iniciarProva() {

    if (encerrando) return;

    if (localStorage.getItem(CHAVE_ENCERRADA) === "true") {
        mostrarFinal("A avaliação já foi encerrada neste navegador.");
        return;
    }

    const nome = nomeAluno.value.trim();

    if (nome.length < 3) {
        alert("Digite seu nome completo.");
        nomeAluno.focus();
        return;
    }

    localStorage.setItem(CHAVE_NOME, nome);

    alunoExibicao.textContent = "Aluno(a): " + nome;

    inicio.style.display = "none";
    prova.style.display = "block";

    provaIniciada = true;

    tempoRestante = DURACAO_PROVA;

    atualizarCronometro();

    intervalo = setInterval(() => {

        if (!provaIniciada || encerrando) return;

        tempoRestante--;

        atualizarCronometro();

        if (tempoRestante <= 0) {
            encerrarProva("Tempo da avaliação encerrado.");
        }

    }, 1000);

    /*
     * Solicita fullscreen.
     * Alguns navegadores podem bloquear a solicitação,
     * principalmente se o usuário não tiver iniciado por
     * uma interação real.
     */
    try {
        await entrarFullscreen();
    } catch (erro) {
        console.warn("Fullscreen não pôde ser ativado:", erro);
    }

    /*
     * Damos um pequeno intervalo para evitar que o próprio
     * processo de entrada em fullscreen seja interpretado
     * como uma saída.
     */
    setTimeout(() => {

        if (encerrando) return;

        monitoramentoAtivo = true;

        fullscreenConfirmado =
            !!document.fullscreenElement;

    }, 1200);

}


/* ==========================================================
   FULLSCREEN
   ========================================================== */

async function entrarFullscreen() {

    const elemento = document.documentElement;

    if (elemento.requestFullscreen) {
        await elemento.requestFullscreen();
        return;
    }

    if (elemento.webkitRequestFullscreen) {
        elemento.webkitRequestFullscreen();
        return;
    }

    throw new Error("Fullscreen não suportado.");
}


/* ==========================================================
   DETECTA SAÍDA DO FULLSCREEN
   ========================================================== */

document.addEventListener("fullscreenchange", () => {

    if (!provaIniciada || encerrando || !monitoramentoAtivo) {
        return;
    }

    const estaFullscreen = !!document.fullscreenElement;

    /*
     * Se o fullscreen estava confirmado e deixou de estar,
     * encerramos a avaliação.
     */
    if (fullscreenConfirmado && !estaFullscreen) {

        encerrarPorViolacao(
            "A avaliação foi encerrada porque a tela cheia foi abandonada."
        );

    }

});


/* ==========================================================
   DETECTA TROCA DE ABA / JANELA
   ========================================================== */

document.addEventListener("visibilitychange", () => {

    if (!provaIniciada || encerrando || !monitoramentoAtivo) {
        return;
    }

    if (document.hidden) {

        encerrarPorViolacao(
            "A avaliação foi encerrada porque a página deixou de estar ativa."
        );

    }

});


/* ==========================================================
   TENTATIVA DE FECHAR / RECARREGAR / NAVEGAR
   ========================================================== */

window.addEventListener("beforeunload", (event) => {

    if (!provaIniciada || encerrando) {
        return;
    }

    event.preventDefault();

    /*
     * O navegador decide a mensagem exibida.
     * Não é possível definir uma mensagem personalizada
     * na maioria dos navegadores atuais.
     */
    event.returnValue = "";

});


/* ==========================================================
   BOTÃO VOLTAR
   ========================================================== */

history.pushState(null, "", location.href);

window.addEventListener("popstate", () => {

    if (provaIniciada && !encerrando) {

        history.pushState(null, "", location.href);

        encerrarPorViolacao(
            "A avaliação foi encerrada porque houve tentativa de voltar à página anterior."
        );

    }

});


/* ==========================================================
   TECLAS DE ATALHO DO AMBIENTE EXTERNO
   ========================================================== */

/*
 * IMPORTANTE:
 *
 * NÃO bloqueamos:
 * - Tab
 * - Enter
 * - Backspace
 * - setas
 * - Ctrl+C
 * - Ctrl+V
 * - Ctrl+X
 * - Ctrl+A
 *
 * Isso é proposital.
 *
 * O Google Forms está dentro de um iframe de outro domínio.
 * O JavaScript desta página NÃO consegue controlar os campos
 * internos do Google Forms.
 *
 * Portanto, deixar essas teclas livres evita prejudicar
 * a digitação e a navegação dentro do formulário.
 */

document.addEventListener("keydown", (event) => {

    if (!provaIniciada || encerrando) return;

    /*
     * F5 / Ctrl+R / Ctrl+Shift+R
     *
     * O beforeunload também atua como proteção adicional.
     */
    if (
        event.key === "F5" ||
        (
            (event.ctrlKey || event.metaKey) &&
            event.key.toLowerCase() === "r"
        )
    ) {
        event.preventDefault();

        encerrarPorViolacao(
            "A avaliação foi encerrada porque houve tentativa de recarregar a página."
        );

        return;
    }

    /*
     * DevTools / código-fonte / salvar página.
     *
     * Isso protege somente a página externa.
     * Não controla o conteúdo interno do Google Forms.
     */
    if (
        event.key === "F12" ||
        (
            event.ctrlKey &&
            event.shiftKey &&
            ["i", "j", "c"].includes(event.key.toLowerCase())
        ) ||
        (
            event.ctrlKey &&
            event.key.toLowerCase() === "u"
        )
    ) {

        event.preventDefault();

        encerrarPorViolacao(
            "A avaliação foi encerrada por tentativa de acessar recursos do navegador."
        );

    }

});


/* ==========================================================
   INTERAÇÃO COM O GOOGLE FORMS
   ========================================================== */

/*
 * Não existe bloqueio global de clique, mouse, toque ou seleção.
 *
 * O iframe do Google Forms precisa receber os eventos diretamente.
 * Assim, os botões "Avançar", "Voltar", opções, caixas de seleção
 * e o botão "Enviar" permanecem clicáveis.
 */

/* ==========================================================
   NENHUM BLOQUEIO DE MOUSE / TECLADO NO FORMULÁRIO
   ========================================================== */

/*
 * Não usamos preventDefault() para:
 * - click
 * - mousedown
 * - mouseup
 * - pointerdown
 * - pointerup
 * - touchstart
 * - touchend
 * - selectstart
 * - dragstart
 *
 * Isso é essencial para o Google Forms.
 */

/* ==========================================================
   ENCERRAMENTO POR VIOLAÇÃO
   ========================================================== */

function encerrarPorViolacao(mensagem) {

    if (encerrando) return;

    encerrarProva(mensagem);
}


/* ==========================================================
   ENCERRAMENTO
   ========================================================== */

function encerrarProva(mensagem) {

    if (encerrando) return;

    encerrando = true;
    provaIniciada = false;
    monitoramentoAtivo = false;
    fullscreenConfirmado = false;

    if (intervalo) {
        clearInterval(intervalo);
        intervalo = null;
    }

    /*
     * Grava permanentemente o encerramento neste navegador.
     */
    localStorage.setItem(CHAVE_ENCERRADA, "true");

    /*
     * Remove o formulário da tela.
     * Isso impede que o aluno continue respondendo.
     */
    try {
        googleForm.src = "about:blank";
    } catch (erro) {
        console.warn(erro);
    }

    prova.style.display = "none";

    mostrarFinal(mensagem);

    sairFullscreen();

}


/* ==========================================================
   MOSTRAR TELA FINAL
   ========================================================== */

function mostrarFinal(mensagem) {

    inicio.style.display = "none";
    prova.style.display = "none";

    motivoFinal.textContent =
        mensagem ||
        "A avaliação foi encerrada.";

    finalizado.style.display = "flex";
}


/* ==========================================================
   SAIR DO FULLSCREEN
   ========================================================== */

async function sairFullscreen() {

    try {

        if (document.fullscreenElement && document.exitFullscreen) {
            await document.exitFullscreen();
        }

    } catch (erro) {

        console.warn(
            "Não foi possível sair do fullscreen:",
            erro
        );

    }

}


/* ==========================================================
   CRONÔMETRO
   ========================================================== */

function atualizarCronometro() {

    let segundos = Math.max(0, tempoRestante);

    const minutos = Math.floor(segundos / 60);
    const resto = segundos % 60;

    cronometro.textContent =
        String(minutos).padStart(2, "0") +
        ":" +
        String(resto).padStart(2, "0");

    /*
     * Últimos 5 minutos.
     */
    if (segundos <= 300) {
        cronometro.classList.add("critico");
    } else {
        cronometro.classList.remove("critico");
    }

}


/* ==========================================================
   PROTEÇÃO CONTRA DUPLO CARREGAMENTO
   ========================================================== */

window.addEventListener("load", () => {

    if (localStorage.getItem(CHAVE_ENCERRADA) === "true") {
        mostrarFinal("A avaliação já foi encerrada neste navegador.");
    }

});
</script>

</body>
</html>
